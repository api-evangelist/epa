naftiko: 1.0.0-alpha2
info:
  label: Emissions Management OpenAPI Specification — Apportioned Hourly MATS Emissions
  description: 'Apportioned Hourly MATS Emissions. 1 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Apportioned Hourly MATS Emissions
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-emissions-apportioned-hourly-mats-emissions
      baseUri: https://api.epa.gov/easey
      description: Emissions Management OpenAPI Specification — Apportioned Hourly MATS Emissions business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: emissions-mgmt-emissions-apportioned-mats-hourly
          path: /emissions-mgmt/emissions/apportioned/mats/hourly
          operations:
            - name: hourlyMatsApportionedEmissionsControllergetEmissions
              method: GET
              description: hourlyMatsApportionedEmissionsControllergetEmissions
              inputParameters:
                - name: stateCode
                  in: query
                  type: array
                  required: false
                  description: Two letter abbreviation for the State.
                - name: facilityId
                  in: query
                  type: array
                  required: false
                  description: The Facility ID code assigned by the Department of Energy's Energy Information Administration. The Energy Information Administration Plant ID code is also referred to as the "ORIS code", "ORISPL code"
                - name: unitType
                  in: query
                  type: array
                  required: false
                  description: Type of unit or boiler.
                - name: unitFuelType
                  in: query
                  type: array
                  required: false
                  description: Primary or Secondary fuel types combusted by the unit.
                - name: controlTechnologies
                  in: query
                  type: array
                  required: false
                  description: Method or equipment used by the combustion unit to minimize Hg, NOx, PM, or SO2 emissions.
                - name: beginDate
                  in: query
                  type: string
                  required: true
                  description: Begin date for a given period of a unit's emissions.
                - name: endDate
                  in: query
                  type: string
                  required: true
                  description: End date for a given period of a unit's emissions.
                - name: operatingHoursOnly
                  in: query
                  type: boolean
                  required: false
                  description: Indicator of whether or not a request should return only data for hours where a unit operated.
                - name: page
                  in: query
                  type: number
                  required: true
                  description: Page number of data being requested.
                - name: perPage
                  in: query
                  type: number
                  required: true
                  description: Number of results per page.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-emissions-apportioned-hourly-mats-emissions-rest
      port: 8080
      description: REST adapter for Emissions Management OpenAPI Specification — Apportioned Hourly MATS Emissions. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/emissions-mgmt/emissions/apportioned/mats/hourly
          name: emissions-mgmt-emissions-apportioned-mats-hourly
          description: REST surface for hourlyMatsApportionedEmissionsControllergetEmissions.
          operations:
            - method: GET
              name: hourlyMatsApportionedEmissionsControllergetEmissions
              description: hourlyMatsApportionedEmissionsControllergetEmissions
              call: cam-emissions-apportioned-hourly-mats-emissions.hourlyMatsApportionedEmissionsControllergetEmissions
              with:
                stateCode: rest.stateCode
                facilityId: rest.facilityId
                unitType: rest.unitType
                unitFuelType: rest.unitFuelType
                controlTechnologies: rest.controlTechnologies
                beginDate: rest.beginDate
                endDate: rest.endDate
                operatingHoursOnly: rest.operatingHoursOnly
                page: rest.page
                perPage: rest.perPage
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-emissions-apportioned-hourly-mats-emissions-mcp
      port: 9090
      transport: http
      description: MCP adapter for Emissions Management OpenAPI Specification — Apportioned Hourly MATS Emissions. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: hourlymatsapportionedemissionscontroller-getemissions
          description: hourlymatsapportionedemissionscontroller-getemissions
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-emissions-apportioned-hourly-mats-emissions.hourlyMatsApportionedEmissionsControllergetEmissions
          with:
            stateCode: tools.stateCode
            facilityId: tools.facilityId
            unitType: tools.unitType
            unitFuelType: tools.unitFuelType
            controlTechnologies: tools.controlTechnologies
            beginDate: tools.beginDate
            endDate: tools.endDate
            operatingHoursOnly: tools.operatingHoursOnly
            page: tools.page
            perPage: tools.perPage
          outputParameters:
            - type: object
              mapping: $.
