naftiko: 1.0.0-alpha2
info:
  label: Account Management OpenAPI Specification — Emissions Compliance
  description: 'Emissions Compliance. 3 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Emissions Compliance
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-account-emissions-compliance
      baseUri: https://api.epa.gov/easey
      description: Account Management OpenAPI Specification — Emissions Compliance business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: account-mgmt-emissions-compliance
          path: /account-mgmt/emissions-compliance
          operations:
            - name: emissionsComplianceControllergetEmissionsCompliance
              method: GET
              description: emissionsComplianceControllergetEmissionsCompliance
              inputParameters:
                - name: stateCode
                  in: query
                  type: array
                  required: false
                  description: Two letter abbreviation for the State.
                - name: facilityId
                  in: query
                  type: array
                  required: false
                  description: The Facility ID code assigned by the Department of Energy's Energy Information Administration. The Energy Information Administration Plant ID code is also referred to as the "ORIS code", "ORISPL code"
                - name: ownerOperator
                  in: query
                  type: array
                  required: false
                  description: The name of any company that owns an allowance account or an affected unit.The name of any company that operates an affected unit.
                - name: year
                  in: query
                  type: array
                  required: false
                  description: The calendar year during which activity occurred.
                - name: page
                  in: query
                  type: number
                  required: true
                  description: Page number of data being requested.
                - name: perPage
                  in: query
                  type: number
                  required: true
                  description: Number of results per page.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: account-mgmt-emissions-compliance-attributes-applicable
          path: /account-mgmt/emissions-compliance/attributes/applicable
          operations:
            - name: emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes
              method: GET
              description: emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: account-mgmt-emissions-compliance-owner-operators
          path: /account-mgmt/emissions-compliance/owner-operators
          operations:
            - name: emissionsComplianceControllergetAllOwnerOperators
              method: GET
              description: emissionsComplianceControllergetAllOwnerOperators
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-account-emissions-compliance-rest
      port: 8080
      description: REST adapter for Account Management OpenAPI Specification — Emissions Compliance. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/account-mgmt/emissions-compliance
          name: account-mgmt-emissions-compliance
          description: REST surface for emissionsComplianceControllergetEmissionsCompliance.
          operations:
            - method: GET
              name: emissionsComplianceControllergetEmissionsCompliance
              description: emissionsComplianceControllergetEmissionsCompliance
              call: cam-account-emissions-compliance.emissionsComplianceControllergetEmissionsCompliance
              with:
                stateCode: rest.stateCode
                facilityId: rest.facilityId
                ownerOperator: rest.ownerOperator
                year: rest.year
                page: rest.page
                perPage: rest.perPage
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/account-mgmt/emissions-compliance/attributes/applicable
          name: account-mgmt-emissions-compliance-attributes-applicable
          description: REST surface for emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes.
          operations:
            - method: GET
              name: emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes
              description: emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes
              call: cam-account-emissions-compliance.emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes
              with: {}
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/account-mgmt/emissions-compliance/owner-operators
          name: account-mgmt-emissions-compliance-owner-operators
          description: REST surface for emissionsComplianceControllergetAllOwnerOperators.
          operations:
            - method: GET
              name: emissionsComplianceControllergetAllOwnerOperators
              description: emissionsComplianceControllergetAllOwnerOperators
              call: cam-account-emissions-compliance.emissionsComplianceControllergetAllOwnerOperators
              with: {}
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-account-emissions-compliance-mcp
      port: 9090
      transport: http
      description: MCP adapter for Account Management OpenAPI Specification — Emissions Compliance. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: emissionscompliancecontroller-getemissionscompliance
          description: emissionscompliancecontroller-getemissionscompliance
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-account-emissions-compliance.emissionsComplianceControllergetEmissionsCompliance
          with:
            stateCode: tools.stateCode
            facilityId: tools.facilityId
            ownerOperator: tools.ownerOperator
            year: tools.year
            page: tools.page
            perPage: tools.perPage
          outputParameters:
            - type: object
              mapping: $.
        - name: emissionscompliancecontroller-getallapplicableemissionscomplianceattributes
          description: emissionscompliancecontroller-getallapplicableemissionscomplianceattributes
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-account-emissions-compliance.emissionsComplianceControllergetAllApplicableEmissionsComplianceAttributes
          with: {}
          outputParameters:
            - type: object
              mapping: $.
        - name: emissionscompliancecontroller-getallowneroperators
          description: emissionscompliancecontroller-getallowneroperators
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-account-emissions-compliance.emissionsComplianceControllergetAllOwnerOperators
          with: {}
          outputParameters:
            - type: object
              mapping: $.
