naftiko: 1.0.0-alpha2
info:
  label: U.S. EPA Enforcement and Compliance History Online (ECHO) - Enforcement Case Search — Lookups
  description: 'Lookups. 2 operations. Lead operation: ECHO ICIS Law Sections Lookup Service. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Lookups
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys: {}
capability:
  consumes:
    - type: http
      namespace: echo-case-lookups
      baseUri: https://echodata.epa.gov/echo
      description: U.S. EPA Enforcement and Compliance History Online (ECHO) - Enforcement Case Search — Lookups business capability. Self-contained, no shared references.
      resources:
        - name: rest-lookups-icis-law-sections
          path: /rest_lookups.icis_law_sections
          operations:
            - name: getrestlookupsicislawsections
              method: GET
              description: ECHO ICIS Law Sections Lookup Service
              inputParameters:
                - name: output
                  in: query
                  type: string
                  required: false
                  description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Paddi"
                - name: callback
                  in: query
                  type: string
                  required: false
                  description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
                - name: statute_code
                  in: query
                  type: string
                  required: false
                  description: statute_code
                - name: status_flag
                  in: query
                  type: string
                  required: false
                  description: status_flag
                - name: search_term
                  in: query
                  type: string
                  required: false
                  description: Enter a partial or complete search phrase or word.
                - name: search_code
                  in: query
                  type: string
                  required: false
                  description: Enter a partial or complete code value.
                - name: sort_order
                  in: query
                  type: number
                  required: false
                  description: sort_order
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: rest-lookups-icis-law-sections
          path: /rest_lookups.icis_law_sections
          operations:
            - name: postrestlookupsicislawsections
              method: POST
              description: ECHO ICIS Law Sections Lookup Service
              inputParameters:
                - name: output
                  in: formData
                  type: string
                  required: false
                  description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Paddi"
                - name: callback
                  in: formData
                  type: string
                  required: false
                  description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
                - name: statute_code
                  in: formData
                  type: string
                  required: false
                  description: statute_code
                - name: status_flag
                  in: formData
                  type: string
                  required: false
                  description: status_flag
                - name: search_term
                  in: formData
                  type: string
                  required: false
                  description: Enter a partial or complete search phrase or word.
                - name: search_code
                  in: formData
                  type: string
                  required: false
                  description: Enter a partial or complete code value.
                - name: sort_order
                  in: formData
                  type: number
                  required: false
                  description: sort_order
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: echo-case-lookups-rest
      port: 8080
      description: REST adapter for U.S. EPA Enforcement and Compliance History Online (ECHO) - Enforcement Case Search — Lookups. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/rest_lookups.icis_law_sections
          name: rest-lookups-icis-law-sections
          description: REST surface for ECHO ICIS Law Sections Lookup Service.
          operations:
            - method: GET
              name: getrestlookupsicislawsections
              description: ECHO ICIS Law Sections Lookup Service
              call: echo-case-lookups.getrestlookupsicislawsections
              with:
                output: rest.output
                callback: rest.callback
                statute_code: rest.statute_code
                status_flag: rest.status_flag
                search_term: rest.search_term
                search_code: rest.search_code
                sort_order: rest.sort_order
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/rest_lookups.icis_law_sections
          name: rest-lookups-icis-law-sections
          description: REST surface for ECHO ICIS Law Sections Lookup Service.
          operations:
            - method: POST
              name: postrestlookupsicislawsections
              description: ECHO ICIS Law Sections Lookup Service
              call: echo-case-lookups.postrestlookupsicislawsections
              with:
                output: rest.output
                callback: rest.callback
                statute_code: rest.statute_code
                status_flag: rest.status_flag
                search_term: rest.search_term
                search_code: rest.search_code
                sort_order: rest.sort_order
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: echo-case-lookups-mcp
      port: 9090
      transport: http
      description: MCP adapter for U.S. EPA Enforcement and Compliance History Online (ECHO) - Enforcement Case Search — Lookups. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: echo-icis-law-sections-lookup-service
          description: ECHO ICIS Law Sections Lookup Service
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: echo-case-lookups.getrestlookupsicislawsections
          with:
            output: tools.output
            callback: tools.callback
            statute_code: tools.statute_code
            status_flag: tools.status_flag
            search_term: tools.search_term
            search_code: tools.search_code
            sort_order: tools.sort_order
          outputParameters:
            - type: object
              mapping: $.
        - name: echo-icis-law-sections-lookup-service-2
          description: ECHO ICIS Law Sections Lookup Service
          hints:
            readOnly: true
            destructive: false
            idempotent: false
          call: echo-case-lookups.postrestlookupsicislawsections
          with:
            output: tools.output
            callback: tools.callback
            statute_code: tools.statute_code
            status_flag: tools.status_flag
            search_term: tools.search_term
            search_code: tools.search_code
            sort_order: tools.sort_order
          outputParameters:
            - type: object
              mapping: $.
