naftiko: 1.0.0-alpha2
info:
  label: Emissions Management OpenAPI Specification — Emissions Views
  description: 'Emissions Views. 2 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Emissions Views
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-emissions-emissions-views
      baseUri: https://api.epa.gov/easey
      description: Emissions Management OpenAPI Specification — Emissions Views business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: emissions-mgmt-emissions-views
          path: /emissions-mgmt/emissions/views
          operations:
            - name: emissionsViewControllergetAvailableViews
              method: GET
              description: emissionsViewControllergetAvailableViews
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: emissions-mgmt-emissions-views-viewcode
          path: /emissions-mgmt/emissions/views/{viewCode}
          operations:
            - name: emissionsViewControllergetView
              method: GET
              description: emissionsViewControllergetView
              inputParameters:
                - name: viewCode
                  in: path
                  type: string
                  required: true
                  description: viewCode
                - name: monitorPlanId
                  in: query
                  type: string
                  required: true
                  description: monitorPlanId
                - name: unitIds
                  in: query
                  type: array
                  required: false
                  description: Unique identifier for each unit at a facility.
                - name: stackPipeIds
                  in: query
                  type: array
                  required: false
                  description: This is the alphanumeric code assigned by a source to identify a multiple or common stack or pipe at which emissions are determined.
                - name: reportingPeriod
                  in: query
                  type: array
                  required: true
                  description: reportingPeriod
                - name: attachFile
                  in: query
                  type: boolean
                  required: false
                  description: Attaches a file with data in the format specified by the Accept header
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-emissions-emissions-views-rest
      port: 8080
      description: REST adapter for Emissions Management OpenAPI Specification — Emissions Views. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/emissions-mgmt/emissions/views
          name: emissions-mgmt-emissions-views
          description: REST surface for emissionsViewControllergetAvailableViews.
          operations:
            - method: GET
              name: emissionsViewControllergetAvailableViews
              description: emissionsViewControllergetAvailableViews
              call: cam-emissions-emissions-views.emissionsViewControllergetAvailableViews
              with: {}
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/emissions-mgmt/emissions/views/{viewcode}
          name: emissions-mgmt-emissions-views-viewcode
          description: REST surface for emissionsViewControllergetView.
          operations:
            - method: GET
              name: emissionsViewControllergetView
              description: emissionsViewControllergetView
              call: cam-emissions-emissions-views.emissionsViewControllergetView
              with:
                viewCode: rest.viewCode
                monitorPlanId: rest.monitorPlanId
                unitIds: rest.unitIds
                stackPipeIds: rest.stackPipeIds
                reportingPeriod: rest.reportingPeriod
                attachFile: rest.attachFile
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-emissions-emissions-views-mcp
      port: 9090
      transport: http
      description: MCP adapter for Emissions Management OpenAPI Specification — Emissions Views. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: emissionsviewcontroller-getavailableviews
          description: emissionsviewcontroller-getavailableviews
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-emissions-emissions-views.emissionsViewControllergetAvailableViews
          with: {}
          outputParameters:
            - type: object
              mapping: $.
        - name: emissionsviewcontroller-getview
          description: emissionsviewcontroller-getview
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-emissions-emissions-views.emissionsViewControllergetView
          with:
            viewCode: tools.viewCode
            monitorPlanId: tools.monitorPlanId
            unitIds: tools.unitIds
            stackPipeIds: tools.stackPipeIds
            reportingPeriod: tools.reportingPeriod
            attachFile: tools.attachFile
          outputParameters:
            - type: object
              mapping: $.
