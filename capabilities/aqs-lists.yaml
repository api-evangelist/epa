naftiko: 1.0.0-alpha2
info:
  label: EPA Air Quality System (AQS) API — Lists
  description: 'Lists. 8 operations. Lead operation: List States. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Lists
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_EMAILKEY_KEY: EPA_EMAILKEY_KEY
capability:
  consumes:
    - type: http
      namespace: aqs-lists
      baseUri: https://aqs.epa.gov/data/api
      description: EPA Air Quality System (AQS) API — Lists business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: key
        value: '{{env.EPA_EMAILKEY_KEY}}'
        placement: query
      resources:
        - name: list-states
          path: /list/states
          operations:
            - name: listStates
              method: GET
              description: List States
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-countiesbystate
          path: /list/countiesByState
          operations:
            - name: listCountiesByState
              method: GET
              description: List Counties by State
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: state
                  in: query
                  type: string
                  required: true
                  description: 2-digit state FIPS code.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-sitesbycounty
          path: /list/sitesByCounty
          operations:
            - name: listSitesByCounty
              method: GET
              description: List Sites by County
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: state
                  in: query
                  type: string
                  required: true
                  description: 2-digit state FIPS code.
                - name: county
                  in: query
                  type: string
                  required: true
                  description: 3-digit county code.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-cbsas
          path: /list/cbsas
          operations:
            - name: listCbsas
              method: GET
              description: List Core Based Statistical Areas
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-classes
          path: /list/classes
          operations:
            - name: listClasses
              method: GET
              description: List Parameter Classes
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-parametersbyclass
          path: /list/parametersByClass
          operations:
            - name: listParametersByClass
              method: GET
              description: List Parameters by Class
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: pc
                  in: query
                  type: string
                  required: true
                  description: pc
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-pqaos
          path: /list/pqaos
          operations:
            - name: listPqaos
              method: GET
              description: List Primary Quality Assurance Organizations
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: list-mas
          path: /list/mas
          operations:
            - name: listMas
              method: GET
              description: List Monitoring Agencies
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: aqs-lists-rest
      port: 8080
      description: REST adapter for EPA Air Quality System (AQS) API — Lists. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/list/states
          name: list-states
          description: REST surface for List States.
          operations:
            - method: GET
              name: listStates
              description: List States
              call: aqs-lists.listStates
              with:
                email: rest.email
                key: rest.key
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/list/countiesbystate
          name: list-countiesbystate
          description: REST surface for List Counties by State.
          operations:
            - method: GET
              name: listCountiesByState
