naftiko: 1.0.0-alpha2
info:
  label: Monitor Plan Management OpenAPI Specification — Components
  description: 'Components. 1 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Components
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-monitor-plan-components
      baseUri: https://api.epa.gov/easey
      description: Monitor Plan Management OpenAPI Specification — Components business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: monitor-plan-mgmt-locations-locid-components
          path: /monitor-plan-mgmt/locations/{locId}/components
          operations:
            - name: componentControllergetComponents
              method: GET
              description: componentControllergetComponents
              inputParameters:
                - name: locId
                  in: path
                  type: string
                  required: true
                  description: locId
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-monitor-plan-components-rest
      port: 8080
      description: REST adapter for Monitor Plan Management OpenAPI Specification — Components. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/monitor-plan-mgmt/locations/{locid}/components
          name: monitor-plan-mgmt-locations-locid-components
          description: REST surface for componentControllergetComponents.
          operations:
            - method: GET
              name: componentControllergetComponents
              description: componentControllergetComponents
              call: cam-monitor-plan-components.componentControllergetComponents
              with:
                locId: rest.locId
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-monitor-plan-components-mcp
      port: 9090
      transport: http
      description: MCP adapter for Monitor Plan Management OpenAPI Specification — Components. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: componentcontroller-getcomponents
          description: componentcontroller-getcomponents
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-monitor-plan-components.componentControllergetComponents
          with:
            locId: tools.locId
          outputParameters:
            - type: object
              mapping: $.
