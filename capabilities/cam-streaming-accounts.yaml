naftiko: 1.0.0-alpha2
info:
  label: Streaming Services OpenAPI Specification — Accounts
  description: 'Accounts. 1 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Accounts
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-streaming-accounts
      baseUri: https://api.epa.gov/easey
      description: Streaming Services OpenAPI Specification — Accounts business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: streaming-services-accounts-attributes
          path: /streaming-services/accounts/attributes
          operations:
            - name: accountControllerstreamAllAccountAttributes
              method: GET
              description: accountControllerstreamAllAccountAttributes
              inputParameters:
                - name: accountType
                  in: query
                  type: array
                  required: false
                  description: Type of allowance account (Facility, General, etc.).
                - name: accountNumber
                  in: query
                  type: array
                  required: false
                  description: The unique identification number of an account.
                - name: facilityId
                  in: query
                  type: array
                  required: false
                  description: The Facility ID code assigned by the Department of Energy's Energy Information Administration. The Energy Information Administration Plant ID code is also referred to as the "ORIS code", "ORISPL code"
                - name: stateCode
                  in: query
                  type: array
                  required: false
                  description: Two letter abbreviation for the State.
                - name: ownerOperator
                  in: query
                  type: array
                  required: false
                  description: The name of any company that owns an allowance account or an affected unit.The name of any company that operates an affected unit.
                - name: programCodeInfo
                  in: query
                  type: array
                  required: false
                  description: Statutory or regulatory based options for tracking and reducing air pollution emissions.
                - name: exclude
                  in: query
                  type: array
                  required: false
                  description: Selected items will be excluded from the response
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-streaming-accounts-rest
      port: 8080
      description: REST adapter for Streaming Services OpenAPI Specification — Accounts. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/streaming-services/accounts/attributes
          name: streaming-services-accounts-attributes
          description: REST surface for accountControllerstreamAllAccountAttributes.
          operations:
            - method: GET
              name: accountControllerstreamAllAccountAttributes
              description: accountControllerstreamAllAccountAttributes
              call: cam-streaming-accounts.accountControllerstreamAllAccountAttributes
              with:
                accountType: rest.accountType
                accountNumber: rest.accountNumber
                facilityId: rest.facilityId
                stateCode: rest.stateCode
                ownerOperator: rest.ownerOperator
                programCodeInfo: rest.programCodeInfo
                exclude: rest.exclude
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-streaming-accounts-mcp
      port: 9090
      transport: http
      description: MCP adapter for Streaming Services OpenAPI Specification — Accounts. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: accountcontroller-streamallaccountattributes
          description: accountcontroller-streamallaccountattributes
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-streaming-accounts.accountControllerstreamAllAccountAttributes
          with:
            accountType: tools.accountType
            accountNumber: tools.accountNumber
            facilityId: tools.facilityId
            stateCode: tools.stateCode
            ownerOperator: tools.ownerOperator
            programCodeInfo: tools.programCodeInfo
            exclude: tools.exclude
          outputParameters:
            - type: object
              mapping: $.
