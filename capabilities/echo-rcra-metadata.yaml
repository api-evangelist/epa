naftiko: 1.0.0-alpha2
info:
  label: U.S. EPA Enforcement and Compliance History Online (ECHO) - Resource Conservation and Recovery Act  — Metadata
  description: 'Metadata. 2 operations. Lead operation: Resource Conservation and Recovery Act (RCRA) Metadata Service. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Metadata
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys: {}
capability:
  consumes:
    - type: http
      namespace: echo-rcra-metadata
      baseUri: https://echodata.epa.gov/echo
      description: U.S. EPA Enforcement and Compliance History Online (ECHO) - Resource Conservation and Recovery Act  — Metadata business capability. Self-contained, no shared references.
      resources:
        - name: rcra-rest-services-metadata
          path: /rcra_rest_services.metadata
          operations:
            - name: getrcrarestservicesmetadata
              method: GET
              description: Resource Conservation and Recovery Act (RCRA) Metadata Service
              inputParameters:
                - name: output
                  in: query
                  type: string
                  required: false
                  description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Paddi"
                - name: callback
                  in: query
                  type: string
                  required: false
                  description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: rcra-rest-services-metadata
          path: /rcra_rest_services.metadata
          operations:
            - name: postrcrarestservicesmetadata
              method: POST
              description: Resource Conservation and Recovery Act (RCRA) Metadata Service
              inputParameters:
                - name: output
                  in: formData
                  type: string
                  required: false
                  description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Paddi"
                - name: callback
                  in: formData
                  type: string
                  required: false
                  description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: echo-rcra-metadata-rest
      port: 8080
      description: REST adapter for U.S. EPA Enforcement and Compliance History Online (ECHO) - Resource Conservation and Recovery Act  — Metadata. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/rcra_rest_services.metadata
          name: rcra-rest-services-metadata
          description: REST surface for Resource Conservation and Recovery Act (RCRA) Metadata Service.
          operations:
            - method: GET
              name: getrcrarestservicesmetadata
              description: Resource Conservation and Recovery Act (RCRA) Metadata Service
              call: echo-rcra-metadata.getrcrarestservicesmetadata
              with:
                output: rest.output
                callback: rest.callback
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/rcra_rest_services.metadata
          name: rcra-rest-services-metadata
          description: REST surface for Resource Conservation and Recovery Act (RCRA) Metadata Service.
          operations:
            - method: POST
              name: postrcrarestservicesmetadata
              description: Resource Conservation and Recovery Act (RCRA) Metadata Service
              call: echo-rcra-metadata.postrcrarestservicesmetadata
              with:
                output: rest.output
                callback: rest.callback
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: echo-rcra-metadata-mcp
      port: 9090
      transport: http
      description: MCP adapter for U.S. EPA Enforcement and Compliance History Online (ECHO) - Resource Conservation and Recovery Act  — Metadata. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: resource-conservation-recovery-act-rcra-metadata-service
          description: Resource Conservation and Recovery Act (RCRA) Metadata Service
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: echo-rcra-metadata.getrcrarestservicesmetadata
          with:
            output: tools.output
            callback: tools.callback
          outputParameters:
            - type: object
              mapping: $.
        - name: resource-conservation-recovery-act-rcra-metadata-service-2
          description: Resource Conservation and Recovery Act (RCRA) Metadata Service
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: echo-rcra-metadata.postrcrarestservicesmetadata
          with:
            output: tools.output
            callback: tools.callback
          outputParameters:
            - type: object
              mapping: $.
