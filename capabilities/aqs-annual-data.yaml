              call: aqs-annual-data.annualDataBySite
              with:
                email: rest.email
                key: rest.key
                param: rest.param
                bdate: rest.bdate
                edate: rest.edate
                state: rest.state
                county: rest.county
                site: rest.site
                cbdate: rest.cbdate
                cedate: rest.cedate
              outputParameters:
