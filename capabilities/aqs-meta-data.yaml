naftiko: 1.0.0-alpha2
info:
  label: EPA Air Quality System (AQS) API — Meta Data
  description: 'Meta Data. 4 operations. Lead operation: Check API Availability. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Meta Data
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_EMAILKEY_KEY: EPA_EMAILKEY_KEY
capability:
  consumes:
    - type: http
      namespace: aqs-meta-data
      baseUri: https://aqs.epa.gov/data/api
      description: EPA Air Quality System (AQS) API — Meta Data business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: key
        value: '{{env.EPA_EMAILKEY_KEY}}'
        placement: query
      resources:
        - name: metadata-isavailable
          path: /metaData/isAvailable
          operations:
            - name: metaDataIsAvailable
              method: GET
              description: Check API Availability
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: metadata-revisionhistory
          path: /metaData/revisionHistory
          operations:
            - name: metaDataRevisionHistory
              method: GET
              description: Get Revision History
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: metadata-fieldsbyservice
          path: /metaData/fieldsByService
          operations:
            - name: metaDataFieldsByService
              method: GET
              description: List Fields by Service
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: service
                  in: query
                  type: string
                  required: true
                  description: service
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: metadata-issues
          path: /metaData/issues
          operations:
            - name: metaDataIssues
              method: GET
              description: List Known Issues
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: aqs-meta-data-rest
      port: 8080
      description: REST adapter for EPA Air Quality System (AQS) API — Meta Data. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/metadata/isavailable
          name: metadata-isavailable
          description: REST surface for Check API Availability.
          operations:
            - method: GET
              name: metaDataIsAvailable
              description: Check API Availability
              call: aqs-meta-data.metaDataIsAvailable
              with:
                email: rest.email
                key: rest.key
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/metadata/revisionhistory
          name: metadata-revisionhistory
          description: REST surface for Get Revision History.
          operations:
            - method: GET
              name: metaDataRevisionHistory
              description: Get Revision History
              call: aqs-meta-data.metaDataRevisionHistory
              with:
                email: rest.email
                key: rest.key
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/metadata/fieldsbyservice
          name: metadata-fieldsbyservice
          description: REST surface for List Fields by Service.
          operations:
            - method: GET
              name: metaDataFieldsByService
              description: List Fields by Service
              call: aqs-meta-data.metaDataFieldsByService
              with:
                email: rest.email
                key: rest.key
                service: rest.service
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/metadata/issues
          name: metadata-issues
          description: REST surface for List Known Issues.
          operations:
            - method: GET
              name: metaDataIssues
              description: List Known Issues
              call: aqs-meta-data.metaDataIssues
              with:
                email: rest.email
                key: rest.key
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: aqs-meta-data-mcp
      port: 9090
      transport: http
      description: MCP adapter for EPA Air Quality System (AQS) API — Meta Data. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: check-api-availability
          description: Check API Availability
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: aqs-meta-data.metaDataIsAvailable
          with:
            email: tools.email
            key: tools.key
          outputParameters:
            - type: object
              mapping: $.
        - name: get-revision-history
          description: Get Revision History
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: aqs-meta-data.metaDataRevisionHistory
          with:
            email: tools.email
            key: tools.key
          outputParameters:
            - type: object
              mapping: $.
        - name: list-fields-service
          description: List Fields by Service
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: aqs-meta-data.metaDataFieldsByService
          with:
            email: tools.email
            key: tools.key
            service: tools.service
          outputParameters:
            - type: object
              mapping: $.
        - name: list-known-issues
          description: List Known Issues
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: aqs-meta-data.metaDataIssues
          with:
            email: tools.email
            key: tools.key
          outputParameters:
            - type: object
              mapping: $.
