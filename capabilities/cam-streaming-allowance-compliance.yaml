naftiko: 1.0.0-alpha2
info:
  label: Streaming Services OpenAPI Specification — Allowance Compliance
  description: 'Allowance Compliance. 1 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Allowance Compliance
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-streaming-allowance-compliance
      baseUri: https://api.epa.gov/easey
      description: Streaming Services OpenAPI Specification — Allowance Compliance business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: streaming-services-allowance-compliance
          path: /streaming-services/allowance-compliance
          operations:
            - name: allowanceComplianceControllerstreamAllowanceCompliance
              method: GET
              description: allowanceComplianceControllerstreamAllowanceCompliance
              inputParameters:
                - name: stateCode
                  in: query
                  type: array
                  required: false
                  description: Two letter abbreviation for the State.
                - name: facilityId
                  in: query
                  type: array
                  required: false
                  description: The Facility ID code assigned by the Department of Energy's Energy Information Administration. The Energy Information Administration Plant ID code is also referred to as the "ORIS code", "ORISPL code"
                - name: ownerOperator
                  in: query
                  type: array
                  required: false
                  description: The name of any company that owns an allowance account or an affected unit.The name of any company that operates an affected unit.
                - name: programCodeInfo
                  in: query
                  type: array
                  required: false
                  description: Statutory or regulatory based options for tracking and reducing air pollution emissions.
                - name: year
                  in: query
                  type: array
                  required: false
                  description: The calendar year during which activity occurred.
                - name: exclude
                  in: query
                  type: array
                  required: false
                  description: Selected items will be excluded from the response
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-streaming-allowance-compliance-rest
      port: 8080
      description: REST adapter for Streaming Services OpenAPI Specification — Allowance Compliance. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/streaming-services/allowance-compliance
          name: streaming-services-allowance-compliance
          description: REST surface for allowanceComplianceControllerstreamAllowanceCompliance.
          operations:
            - method: GET
              name: allowanceComplianceControllerstreamAllowanceCompliance
              description: allowanceComplianceControllerstreamAllowanceCompliance
              call: cam-streaming-allowance-compliance.allowanceComplianceControllerstreamAllowanceCompliance
              with:
                stateCode: rest.stateCode
                facilityId: rest.facilityId
                ownerOperator: rest.ownerOperator
                programCodeInfo: rest.programCodeInfo
                year: rest.year
                exclude: rest.exclude
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-streaming-allowance-compliance-mcp
      port: 9090
      transport: http
      description: MCP adapter for Streaming Services OpenAPI Specification — Allowance Compliance. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: allowancecompliancecontroller-streamallowancecompliance
          description: allowancecompliancecontroller-streamallowancecompliance
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-streaming-allowance-compliance.allowanceComplianceControllerstreamAllowanceCompliance
          with:
            stateCode: tools.stateCode
            facilityId: tools.facilityId
            ownerOperator: tools.ownerOperator
            programCodeInfo: tools.programCodeInfo
            year: tools.year
            exclude: tools.exclude
          outputParameters:
            - type: object
              mapping: $.
