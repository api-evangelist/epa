        placement: header
      resources:
        - name: emissions-mgmt-emissions-apportioned-daily
          path: /emissions-mgmt/emissions/apportioned/daily
          operations:
            - name: dailyApportionedEmissionsControllergetEmissions
              method: GET
              description: dailyApportionedEmissionsControllergetEmissions
              inputParameters:
                - name: stateCode
                  in: query
                  type: array
                  required: false
                  description: Two letter abbreviation for the State.
                - name: facilityId
                  in: query
                  type: array
                  required: false
                  description: The Facility ID code assigned by the Department of Energy's Energy Information Administration. The Energy Information Administration Plant ID code is also referred to as the "ORIS code", "ORISPL code"
                - name: unitType
                  in: query
                  type: array
                  required: false
                  description: Type of unit or boiler.
                - name: unitFuelType
                  in: query
                  type: array
                  required: false
                  description: Primary or Secondary fuel types combusted by the unit.
                - name: controlTechnologies
                  in: query
                  type: array
                  required: false
                  description: Method or equipment used by the combustion unit to minimize Hg, NOx, PM, or SO2 emissions.
                - name: programCodeInfo
                  in: query
                  type: array
                  required: false
                  description: Statutory or regulatory based options for tracking and reducing air pollution emissions.
                - name: beginDate
                  in: query
                  type: string
                  required: true
                  description: Begin date for a given period of a unit's emissions.
                - name: endDate
                  in: query
                  type: string
                  required: true
                  description: End date for a given period of a unit's emissions.
                - name: page
                  in: query
                  type: number
                  required: true
                  description: Page number of data being requested.
                - name: perPage
                  in: query
                  type: number
                  required: true
                  description: Number of results per page.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
