naftiko: 1.0.0-alpha2
info:
  label: EPA Air Quality System (AQS) API — Monitors
  description: 'Monitors. 5 operations. Lead operation: List Monitors by Site. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Monitors
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_EMAILKEY_KEY: EPA_EMAILKEY_KEY
capability:
  consumes:
    - type: http
      namespace: aqs-monitors
      baseUri: https://aqs.epa.gov/data/api
      description: EPA Air Quality System (AQS) API — Monitors business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: key
        value: '{{env.EPA_EMAILKEY_KEY}}'
        placement: query
      resources:
        - name: monitors-bysite
          path: /monitors/bySite
          operations:
            - name: monitorsBySite
              method: GET
              description: List Monitors by Site
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: param
                  in: query
                  type: string
                  required: true
                  description: Comma-separated list of up to 5 AQS 5-digit parameter codes.
                - name: bdate
                  in: query
                  type: string
                  required: true
                  description: Begin date (YYYYMMDD).
                - name: edate
                  in: query
                  type: string
                  required: true
                  description: End date (YYYYMMDD). Must be in the same year as bdate for most services.
                - name: state
                  in: query
                  type: string
                  required: true
                  description: 2-digit state FIPS code.
                - name: county
                  in: query
                  type: string
                  required: true
                  description: 3-digit county code.
                - name: site
                  in: query
                  type: string
                  required: true
                  description: 4-digit site code.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: monitors-bycounty
          path: /monitors/byCounty
          operations:
            - name: monitorsByCounty
              method: GET
              description: List Monitors by County
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: param
                  in: query
                  type: string
                  required: true
                  description: Comma-separated list of up to 5 AQS 5-digit parameter codes.
                - name: bdate
                  in: query
                  type: string
                  required: true
                  description: Begin date (YYYYMMDD).
                - name: edate
                  in: query
                  type: string
                  required: true
                  description: End date (YYYYMMDD). Must be in the same year as bdate for most services.
                - name: state
                  in: query
                  type: string
                  required: true
                  description: 2-digit state FIPS code.
                - name: county
                  in: query
                  type: string
                  required: true
                  description: 3-digit county code.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: monitors-bystate
          path: /monitors/byState
          operations:
            - name: monitorsByState
              method: GET
              description: List Monitors by State
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: param
                  in: query
                  type: string
                  required: true
                  description: Comma-separated list of up to 5 AQS 5-digit parameter codes.
                - name: bdate
                  in: query
                  type: string
                  required: true
                  description: Begin date (YYYYMMDD).
                - name: edate
                  in: query
                  type: string
                  required: true
                  description: End date (YYYYMMDD). Must be in the same year as bdate for most services.
                - name: state
                  in: query
                  type: string
                  required: true
                  description: 2-digit state FIPS code.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: monitors-bybox
          path: /monitors/byBox
          operations:
            - name: monitorsByBox
              method: GET
              description: List Monitors by Bounding Box
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: param
                  in: query
                  type: string
                  required: true
                  description: Comma-separated list of up to 5 AQS 5-digit parameter codes.
                - name: bdate
                  in: query
                  type: string
                  required: true
                  description: Begin date (YYYYMMDD).
                - name: edate
                  in: query
                  type: string
                  required: true
                  description: End date (YYYYMMDD). Must be in the same year as bdate for most services.
                - name: minlat
                  in: query
                  type: number
                  required: true
                  description: Minimum latitude of bounding box.
                - name: maxlat
                  in: query
                  type: number
                  required: true
                  description: maxlat
                - name: minlon
                  in: query
                  type: number
                  required: true
                  description: minlon
                - name: maxlon
                  in: query
                  type: number
                  required: true
                  description: maxlon
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: monitors-bycbsa
          path: /monitors/byCBSA
          operations:
            - name: monitorsByCBSA
              method: GET
              description: List Monitors by CBSA
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
