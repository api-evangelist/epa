naftiko: 1.0.0-alpha2
info:
  label: Emissions Management OpenAPI Specification — Apportioned MATS Emissions
  description: 'Apportioned MATS Emissions. 1 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Apportioned MATS Emissions
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-emissions-apportioned-mats-emissions
      baseUri: https://api.epa.gov/easey
      description: Emissions Management OpenAPI Specification — Apportioned MATS Emissions business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: emissions-mgmt-emissions-apportioned-mats-attributes-applicable
          path: /emissions-mgmt/emissions/apportioned/mats/attributes/applicable
          operations:
            - name: matsApportionedEmissionsControllergetApplicableEmissions
              method: GET
              description: matsApportionedEmissionsControllergetApplicableEmissions
              inputParameters:
                - name: year
                  in: query
                  type: array
                  required: true
                  description: The calendar year during which activity occurred.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-emissions-apportioned-mats-emissions-rest
      port: 8080
      description: REST adapter for Emissions Management OpenAPI Specification — Apportioned MATS Emissions. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/emissions-mgmt/emissions/apportioned/mats/attributes/applicable
          name: emissions-mgmt-emissions-apportioned-mats-attributes-applicable
          description: REST surface for matsApportionedEmissionsControllergetApplicableEmissions.
          operations:
            - method: GET
              name: matsApportionedEmissionsControllergetApplicableEmissions
              description: matsApportionedEmissionsControllergetApplicableEmissions
              call: cam-emissions-apportioned-mats-emissions.matsApportionedEmissionsControllergetApplicableEmissions
              with:
                year: rest.year
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-emissions-apportioned-mats-emissions-mcp
      port: 9090
      transport: http
      description: MCP adapter for Emissions Management OpenAPI Specification — Apportioned MATS Emissions. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: matsapportionedemissionscontroller-getapplicableemissions
          description: matsapportionedemissionscontroller-getapplicableemissions
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-emissions-apportioned-mats-emissions.matsApportionedEmissionsControllergetApplicableEmissions
          with:
            year: tools.year
          outputParameters:
            - type: object
              mapping: $.
