  tags:
    - EPA
    - Systems
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-monitor-plan-systems
      baseUri: https://api.epa.gov/easey
      description: Monitor Plan Management OpenAPI Specification — Systems business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: monitor-plan-mgmt-locations-locid-systems
          path: /monitor-plan-mgmt/locations/{locId}/systems
          operations:
            - name: monitorSystemControllergetSystems
              method: GET
              description: monitorSystemControllergetSystems
              inputParameters:
                - name: locId
                  in: path
                  type: string
                  required: true
                  description: locId
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
