    - type: rest
      namespace: cam-monitor-plan-systems-rest
      port: 8080
      description: REST adapter for Monitor Plan Management OpenAPI Specification — Systems. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/monitor-plan-mgmt/locations/{locid}/systems
          name: monitor-plan-mgmt-locations-locid-systems
          description: REST surface for monitorSystemControllergetSystems.
          operations:
            - method: GET
              name: monitorSystemControllergetSystems
              description: monitorSystemControllergetSystems
              call: cam-monitor-plan-systems.monitorSystemControllergetSystems
