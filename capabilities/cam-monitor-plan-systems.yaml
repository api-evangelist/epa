      tools:
        - name: monitorsystemcontroller-getsystems
          description: monitorsystemcontroller-getsystems
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-monitor-plan-systems.monitorSystemControllergetSystems
          with:
            locId: tools.locId
          outputParameters:
            - type: object
              mapping: $.
