naftiko: 1.0.0-alpha2
info:
  label: U.S. EPA Enforcement and Compliance History Online (ECHO) - Safe Drinking Water Act — Metadata
  description: 'Metadata. 2 operations. Lead operation: Safe Drinking Water Act (SDWA) Metadata Service. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Metadata
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys: {}
capability:
  consumes:
    - type: http
      namespace: echo-sdw-metadata
      baseUri: https://echodata.epa.gov/echo
      description: U.S. EPA Enforcement and Compliance History Online (ECHO) - Safe Drinking Water Act — Metadata business capability. Self-contained, no shared references.
      resources:
        - name: sdw-rest-services-metadata
          path: /sdw_rest_services.metadata
          operations:
            - name: getsdwrestservicesmetadata
              method: GET
              description: Safe Drinking Water Act (SDWA) Metadata Service
              inputParameters:
                - name: output
                  in: query
                  type: string
                  required: false
                  description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Paddi"
                - name: callback
                  in: query
                  type: string
                  required: false
                  description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: sdw-rest-services-metadata
          path: /sdw_rest_services.metadata
          operations:
            - name: postsdwrestservicesmetadata
              method: POST
              description: Safe Drinking Water Act (SDWA) Metadata Service
              inputParameters:
                - name: output
                  in: formData
                  type: string
                  required: false
                  description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Paddi"
                - name: callback
                  in: formData
                  type: string
                  required: false
                  description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: echo-sdw-metadata-rest
      port: 8080
      description: REST adapter for U.S. EPA Enforcement and Compliance History Online (ECHO) - Safe Drinking Water Act — Metadata. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/sdw_rest_services.metadata
          name: sdw-rest-services-metadata
          description: REST surface for Safe Drinking Water Act (SDWA) Metadata Service.
          operations:
            - method: GET
              name: getsdwrestservicesmetadata
              description: Safe Drinking Water Act (SDWA) Metadata Service
              call: echo-sdw-metadata.getsdwrestservicesmetadata
              with:
                output: rest.output
                callback: rest.callback
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/sdw_rest_services.metadata
          name: sdw-rest-services-metadata
          description: REST surface for Safe Drinking Water Act (SDWA) Metadata Service.
          operations:
            - method: POST
              name: postsdwrestservicesmetadata
              description: Safe Drinking Water Act (SDWA) Metadata Service
              call: echo-sdw-metadata.postsdwrestservicesmetadata
              with:
                output: rest.output
                callback: rest.callback
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: echo-sdw-metadata-mcp
      port: 9090
      transport: http
      description: MCP adapter for U.S. EPA Enforcement and Compliance History Online (ECHO) - Safe Drinking Water Act — Metadata. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: safe-drinking-water-act-sdwa-metadata-service
          description: Safe Drinking Water Act (SDWA) Metadata Service
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: echo-sdw-metadata.getsdwrestservicesmetadata
          with:
            output: tools.output
            callback: tools.callback
          outputParameters:
            - type: object
              mapping: $.
        - name: safe-drinking-water-act-sdwa-metadata-service-2
          description: Safe Drinking Water Act (SDWA) Metadata Service
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: echo-sdw-metadata.postsdwrestservicesmetadata
          with:
            output: tools.output
            callback: tools.callback
          outputParameters:
            - type: object
              mapping: $.
