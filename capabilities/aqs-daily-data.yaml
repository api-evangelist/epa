naftiko: 1.0.0-alpha2
info:
  label: EPA Air Quality System (AQS) API — Daily Data
  description: 'Daily Data. 5 operations. Lead operation: Get Daily Data by Site. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Daily Data
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_EMAILKEY_KEY: EPA_EMAILKEY_KEY
capability:
  consumes:
    - type: http
      namespace: aqs-daily-data
      baseUri: https://aqs.epa.gov/data/api
      description: EPA Air Quality System (AQS) API — Daily Data business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: key
        value: '{{env.EPA_EMAILKEY_KEY}}'
        placement: query
      resources:
        - name: dailydata-bysite
          path: /dailyData/bySite
          operations:
            - name: dailyDataBySite
              method: GET
              description: Get Daily Data by Site
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: Registered email address.
                - name: key
                  in: query
                  type: string
                  required: true
                  description: Account-specific access key.
                - name: param
                  in: query
                  type: string
                  required: true
                  description: Comma-separated list of up to 5 AQS 5-digit parameter codes.
                - name: bdate
                  in: query
                  type: string
                  required: true
                  description: Begin date (YYYYMMDD).
                - name: edate
                  in: query
                  type: string
                  required: true
                  description: End date (YYYYMMDD). Must be in the same year as bdate for most services.
                - name: state
                  in: query
                  type: string
                  required: true
                  description: 2-digit state FIPS code.
                - name: county
                  in: query
                  type: string
                  required: true
                  description: 3-digit county code.
                - name: site
                  in: query
                  type: string
                  required: true
                  description: 4-digit site code.
                - name: cbdate
                  in: query
                  type: string
                  required: false
                  description: Optional change begin date (returns records updated since cbdate).
                - name: cedate
                  in: query
                  type: string
                  required: false
                  description: Optional change end date.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: dailydata-bycounty
          path: /dailyData/byCounty
          operations:
            - name: dailyDataByCounty
              method: GET
              description: Get Daily Data by County
              inputParameters:
                - name: email
