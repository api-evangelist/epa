  description: 'Comments. 1 operations. Lead operation: operations. Self-contained Naftiko capability covering one EPA business surface.'
  tags:
    - EPA
    - Comments
  created: '2026-05-29'
  modified: '2026-05-29'
binds:
  - namespace: env
    keys:
      EPA_APIKEY_KEY: EPA_APIKEY_KEY
capability:
  consumes:
    - type: http
      namespace: cam-monitor-plan-comments
      baseUri: https://api.epa.gov/easey
      description: Monitor Plan Management OpenAPI Specification — Comments business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.EPA_APIKEY_KEY}}'
        placement: header
      resources:
        - name: monitor-plan-mgmt-plans-planid-comments
          path: /monitor-plan-mgmt/plans/{planId}/comments
          operations:
            - name: monitorPlanCommentControllergetComments
              method: GET
              description: monitorPlanCommentControllergetComments
              inputParameters:
                - name: planId
                  in: path
                  type: string
                  required: true
                  description: planId
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: cam-monitor-plan-comments-rest
      port: 8080
      description: REST adapter for Monitor Plan Management OpenAPI Specification — Comments. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/monitor-plan-mgmt/plans/{planid}/comments
          name: monitor-plan-mgmt-plans-planid-comments
          description: REST surface for monitorPlanCommentControllergetComments.
          operations:
            - method: GET
              name: monitorPlanCommentControllergetComments
              description: monitorPlanCommentControllergetComments
              call: cam-monitor-plan-comments.monitorPlanCommentControllergetComments
              with:
                planId: rest.planId
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: cam-monitor-plan-comments-mcp
      port: 9090
      transport: http
      description: MCP adapter for Monitor Plan Management OpenAPI Specification — Comments. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: monitorplancommentcontroller-getcomments
          description: monitorplancommentcontroller-getcomments
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: cam-monitor-plan-comments.monitorPlanCommentControllergetComments
          with:
            planId: tools.planId
          outputParameters:
            - type: object
              mapping: $.
