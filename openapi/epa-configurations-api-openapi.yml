openapi: 3.0.3
info:
  title: EPA Air Quality System (AQS) Account Type Codes Configurations API
  description: 'The Air Quality System (AQS) Data Mart API provides programmatic access to ambient air

    sample data collected by state, local, tribal and federal air pollution control agencies

    from thousands of monitors across the United States. The API exposes monitor metadata,

    raw sample observations, daily/quarterly/annual aggregates, and quality assurance results.

    '
  version: '1.0'
  contact:
    name: AQS Data Mart Support
    email: aqsdatamart@epa.gov
    url: https://aqs.epa.gov/aqsweb/documents/data_api.html
  license:
    name: U.S. Government Work / Public Domain
    url: https://www.usa.gov/government-works
servers:
- url: https://aqs.epa.gov/data/api
  description: Production AQS Data Mart API
security:
- emailKey: []
tags:
- name: Configurations
paths:
  /monitor-plan-mgmt/configurations:
    get:
      operationId: MonitorConfigurationsController_getConfigurations
      parameters:
      - name: orisCodes
        required: true
        in: query
        description: Array of oris codes
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: number
        example:
        - 0.0
      - name: monPlanIds
        required: false
        in: query
        description: Array of configurations
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
        example:
        - '12345'
      responses:
        '200':
          description: Retrieves official Monitor Plan configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MonitorPlanDTO'
              examples:
                MonitorConfigurationsController_getConfigurations200Example:
                  summary: Default MonitorConfigurationsController_getConfigurations 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      security:
      - APIKey: []
      tags:
      - Configurations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /monitor-plan-mgmt/configurations/last-updated:
    get:
      operationId: MonitorConfigurationsController_getLastUpdated
      parameters:
      - name: date
        required: true
        in: query
        description: Date on which activity occurred. Must be within the last year from current date and cannot be in the future.
        schema:
          format: date
          example: '2019-01-01'
          type: string
        example: '2019-01-01'
      responses:
        '200':
          description: Retrieves workspace Monitor Plan configurations that have been updated after a certain date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastUpdatedConfigDTO'
              examples:
                MonitorConfigurationsController_getLastUpdated200Example:
                  summary: Default MonitorConfigurationsController_getLastUpdated 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      security:
      - APIKey: []
      tags:
      - Configurations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
