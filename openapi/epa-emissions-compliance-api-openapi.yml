openapi: 3.2.0
info:
  title: Epa Emissions Compliance API
  contact: {}
  version: '1.0'
  description: 'Operations tagged Emissions Compliance across 2 of this provider''s published API definitions: cam-account-openapi.json, cam-streaming-openapi.json. Each path carries the servers of the definition it was published in.'
