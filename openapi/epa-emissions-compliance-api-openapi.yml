        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: number
        example:
        - 0.0
      - name: ownerOperator
        required: false
        in: query
        description: The name of any company that owns an allowance account or an affected unit.The name of any company that operates an affected unit.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
        example:
        - string
      - name: year
        required: false
        in: query
        description: The calendar year during which activity occurred.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: number
        example:
        - 2024
      - name: page
        required: true
        in: query
        description: Page number of data being requested.
        schema:
          type: number
        example: 0.0
      - name: perPage
        required: true
        in: query
        description: Number of results per page.
        schema:
          type: number
        example: 0.0
      responses:
        '200':
          description: Retrieves Emissions Compliance Data per filter criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmissionsComplianceDTO'
              examples:
                EmissionsComplianceController_getEmissionsCompliance200Example:
                  summary: Default EmissionsComplianceController_getEmissionsCompliance 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
            text/csv:
              schema:
                type: string
                example: Year,Facility Name,Facility ID,Unit ID,Owner/Operator,State,Compliance Approach,Averaging Plan ID,Emissions Limit (lb/mmBtu),Actual Emissions Rate (lb/mmBtu),Averaging Plan Actual Rate (lb/mmBtu),In Compliance?
              examples:
                EmissionsComplianceController_getEmissionsCompliance200Example:
                  summary: Default EmissionsComplianceController_getEmissionsCompliance 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '400':
          description: Invalid Request
        '404':
          description: Resource Not Found
      security:
      - APIKey: []
      tags:
      - Emissions Compliance
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
