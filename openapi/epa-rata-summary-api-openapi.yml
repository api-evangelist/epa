          example: '12345'
        rataSumId:
          type: string
          example: '12345'
        calculatedRataReferenceValue:
          type: number
          example: 35.5
        userId:
          type: string
          example: '12345'
        addDate:
          type: string
          example: string
        updateDate:
          type: string
          example: string
        runNumber:
          type: number
          example: 0.0
        beginDate:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        beginHour:
          type: number
          example: 0.0
        beginMinute:
          type: number
          example: 0.0
        endDate:
          format: date-time
          type: string
          example: '2024-01-15T12:00:00Z'
        endHour:
          type: number
          example: 0.0
        endMinute:
          type: number
          example: 0.0
        cemValue:
          type: number
          example: 0.0
        rataReferenceValue:
          type: number
          example: 0.0
        grossUnitLoad:
          type: number
          example: 0.0
        runStatusCode:
          type: string
          example: active
      required:
      - flowRataRunData
      - id
      - rataSumId
      - calculatedRataReferenceValue
      - userId
      - addDate
      - updateDate
      - runNumber
      - beginDate
      - beginHour
      - beginMinute
      - endDate
      - endHour
      - endMinute
      - runStatusCode
