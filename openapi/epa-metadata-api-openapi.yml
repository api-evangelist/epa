components:
  parameters:
    Key:
      name: key
      in: query
      required: true
      schema:
        type: string
      description: Account-specific access key.
    Email:
      name: email
      in: query
      required: true
      schema:
        type: string
        format: email
      description: Registered email address.
    q.callback:
      description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
      in: query
      name: callback
      required: false
      schema:
        type: string
    f.callback:
      description: JSONP Callback.  For use with JSONP and GEOJSONP output only.  Enter a name of the function in which to wrap the JSON response.
      in: formData
      name: callback
      required: false
      type: string
  schemas:
    Header:
      type: object
      properties:
        status:
          type: string
          example: active
        request_time:
          type: string
          example: string
        url:
          type: string
          example: https://example.com
        rows:
          type: integer
          example: 100
        error:
          type: array
          items:
            type: string
          example:
          - string
    Envelope:
      type: object
      required:
      - Header
      - Data
      properties:
        Header:
          type: array
          items:
            $ref: '#/components/schemas/Header'
          example:
          - string
        Data:
          type: array
          items:
            type: object
          example:
          - {}
    meta3:
      description: Results Column Object
      properties:
        ColumnID:
          title: Column ID
          type: string
          example: '12345'
        ColumnName:
          title: Column Name
          type: string
          example: EPA Facility
        DataLength:
          description: Data length for EPA program database column.
          example: '10'
          title: Data Length
          type: string
        DataType:
          description: Data type for EPA program database column.
          example: NUMBER
          title: Data Type
          type: string
        Description:
          title: Column Description
          type: string
          example: string
        ObjectName:
          description: The JSON name used for the database column.
          example: CaseName
          title: Object Name
          type: string
      required:
      - ColumnName
      - DataType
      - DataLength
      - ColumnID
      - ObjectName
      - Description
      type: object
      xml:
        name: ResultColumn
    meta1:
      description: Results Object
      properties:
        Message:
          description: Field to record messages (typically performance-related) about packet processing
          example: Success
          title: Message
          type: string
        ResultColumns:
          items:
            $ref: '#/components/schemas/meta3'
          title: Result Columns
          type: array
          xml:
            name: ResultColumns
            wrapped: true
          example:
          - string
      required:
      - Message
      type: object
    met2:
      description: Results Column Object
      properties:
        ColumnID:
          title: Column ID
          type: string
          example: '12345'
        ColumnName:
          title: Column Name
          type: string
          example: EPA Facility
        DataLength:
          description: Data length for EPA program database column.
          example: '10'
          title: Data Length
          type: string
        DataType:
          description: Data type for EPA program database column.
          example: NUMBER
          title: Data Type
          type: string
        Description:
          description: A description of the category of Supplemental Environment Project (SEP) for a settlement.
          title: Description
          type: string
          example: string
        ObjectName:
          description: The JSON name used for the database column.
          example: CaseName
          title: Object Name
          type: string
      required:
      - ColumnName
      - DataType
      - DataLength
      - ColumnID
      - ObjectName
      - Description
      type: object
      xml:
        name: ResultColumn
    met1:
      description: Results Object
      properties:
        Message:
          description: Field to record messages (typically performance-related) about packet processing
          example: Success
          title: Message
          type: string
        ResultColumns:
          items:
            $ref: '#/components/schemas/met2'
          title: Result Columns
          type: array
          xml:
            name: ResultColumns
            wrapped: true
          example:
          - string
      required:
      - Message
      type: object
