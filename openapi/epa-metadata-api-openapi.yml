openapi: 3.2.0
info:
  title: EPA Air Quality System (AQS) Meta Data API
  description: 'The Air Quality System (AQS) Data Mart API provides programmatic access to ambient air

    sample data collected by state, local, tribal and federal air pollution control agencies

    from thousands of monitors across the United States. The API exposes monitor metadata,

    raw sample observations, daily/quarterly/annual aggregates, and quality assurance results.'
  version: '1.0'
  contact:
    name: AQS Data Mart Support
    email: aqsdatamart@epa.gov
    url: https://aqs.epa.gov/aqsweb/documents/data_api.html
  license:
    name: U.S. Government Work / Public Domain
    url: https://www.usa.gov/government-works
servers:
- url: https://aqs.epa.gov/data/api
  description: Production AQS Data Mart API
security:
- emailKey: []
tags:
- name: Metadata
  description: API availability, change history, field definitions, known issues.
paths:
  /metaData/isAvailable:
    get:
      tags:
      - Metadata
      summary: Check API Availability
      operationId: metaDataIsAvailable
      parameters:
      - $ref: '#/components/parameters/Email'
      - $ref: '#/components/parameters/Key'
      responses:
        '200':
          description: API status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                metaDataIsAvailable200Example:
                  summary: Default metaDataIsAvailable 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /metaData/revisionHistory:
    get:
      tags:
      - Metadata
      summary: Get Revision History
      operationId: metaDataRevisionHistory
      parameters:
      - $ref: '#/components/parameters/Email'
      - $ref: '#/components/parameters/Key'
      responses:
        '200':
          description: API change log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                metaDataRevisionHistory200Example:
                  summary: Default metaDataRevisionHistory 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /metaData/fieldsByService:
    get:
      tags:
      - Metadata
      summary: List Fields by Service
      operationId: metaDataFieldsByService
      parameters:
      - $ref: '#/components/parameters/Email'
      - $ref: '#/components/parameters/Key'
      - name: service
        in: query
        required: true
        schema:
          type: string
        example: string
      responses:
        '200':
          description: Field definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                metaDataFieldsByService200Example:
                  summary: Default metaDataFieldsByService 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /metaData/issues:
    get:
      tags:
      - Metadata
      summary: List Known Issues
      operationId: metaDataIssues
      parameters:
      - $ref: '#/components/parameters/Email'
      - $ref: '#/components/parameters/Key'
      responses:
        '200':
          description: Known issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                metaDataIssues200Example:
                  summary: Default metaDataIssues 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /metadata:
    get:
      summary: /metadata
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string
              examples:
                get_metadata200Example:
                  summary: Default get_metadata 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Metadata
      operationId: getMetadata
      x-operation-id-source: derived
  /air_rest_services.metadata:
    get:
      description: Returns the JSON Object Name and ColumnId for usage with the qcolumns parameter for get_qid, get_facility_info and other service endpoints.
      parameters:
      - description: "Output Format Flag.  Enter one of the following keywords:\n- JSON = Data model formatted as Javascript Object Notation (default).\n- JSONP = Data model formatted as Javascript Object Notation with Padding.  \n- XML = Data model formatted as Extensible Markup Language."
        in: query
        name: output
        required: false
        example: string
        schema:
          type: string
          enum:
          - JSONP
          - JSON
          - XML
      - $ref: '#/components/parameters/q.callback'
      responses:
        '200':
          description: Results are an array of columns/objects.
          content:
            application/json:
              schema:
                description: Root Object
                properties:
                  Results:
                    $ref: '#/components/schemas/meta1'
                required:
                - Results
                type: object
                xml:
                  name: Root
            application/xml:
              schema:
                description: Root Object
                properties:
                  Results:
                    $ref: '#/components/schemas/meta1'
                required:
                - Results
                type: object
                xml:
                  name: Root
      summary: Clean Air Act Metadata Service
      tags:
      - Metadata
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getAirRestServicesMetadata
      x-operation-id-source: derived
