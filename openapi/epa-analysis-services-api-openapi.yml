                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /rpc/upstreamdownstream:
    post:
      tags:
      - Analysis Services
      summary: CIP-service Upstream Downstream
      description: CIP-service Upstream Downstream Endpoint
      operationId: upstreamdownstream
