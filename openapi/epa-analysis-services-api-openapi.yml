components:
  schemas:
    geojson_feature:
      type:
      - object
      - 'null'
      title: GeoJSON Feature
      required:
      - type
      - geometry
      - properties
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946#section-3.2
      properties:
        bbox:
          $ref: '#/components/schemas/geojson_bbox'
        geometry:
          $ref: '#/components/schemas/geojson_geometry'
        obj_type:
          type: string
          example: string
        properties:
          discriminator:
            propertyName: obj_type
            mapping:
              event_feature_properties: '#/components/schemas/event_feature_properties'
              indexed_catchment_properties: '#/components/schemas/indexed_catchment_properties'
              indexed_flowline_properties: '#/components/schemas/indexed_flowline_properties'
              navigated_flowline_properties: '#/components/schemas/navigated_flowline_properties'
              delineated_area_properties: '#/components/schemas/delineated_area_properties'
              end_point_properties: '#/components/schemas/end_point_properties'
              indexing_line_properties: '#/components/schemas/indexing_line_properties'
          oneOf:
          - $ref: '#/components/schemas/event_feature_properties'
          - $ref: '#/components/schemas/indexed_catchment_properties'
          - $ref: '#/components/schemas/indexed_flowline_properties'
          - $ref: '#/components/schemas/navigated_flowline_properties'
          - $ref: '#/components/schemas/delineated_area_properties'
          - $ref: '#/components/schemas/end_point_properties'
          - $ref: '#/components/schemas/indexing_line_properties'
          example: string
        type:
          type: string
          enum:
          - Feature
          example: Feature
    search_type:
      description: 'Navigation methodolody for network discovery of events:

        - UT = upstream with tributaries navigation

        - UM = upstream mainstem navigation

        - DM = downstream mainstem navigation

        - DD = downstream with divergences navigation

        - PP = point-to-point mainstem navigation

        - PPALL = point-to-point mainstem navigation with all streams between

        - UTNMD = upstream with tributaries no minor divergences navigation

        '
      type: string
      enum:
      - UM
      - UT
      - DM
      - DD
      - PP
      - PPALL
      examples:
      - UT
    return_delineation_geometry:
      description: Switch whether to return watershed or catchment geometry with results.
      type: boolean
      default: true
      examples:
      - true
    nhdplusid:
      description: NHDPlus int64 nhdplus identifier.
      type: integer
      format: int64
    fcode_allow:
      description: List of FCode values used for selecting a candidate reach measure.
      type: array
      items:
        type: number
    flow_accumulation_resp:
      type: object
      properties:
        flow_accumulation:
          type: string
          format: byte
          example: string
        image_format:
          $ref: '#/components/schemas/image_format'
        image_bbox:
          type: array
          items:
            type: number
          example:
          - 0.0
        max_accumulation:
          type: integer
          example: 35.5
        max_accumulation_x:
          type: integer
          example: 35.5
        max_accumulation_y:
          type: integer
          example: 35.5
        max_accumulation_pt:
          type: integer
          example: 35.5
        raster_srid:
          type: integer
          example: 0
        nhdplus_version:
          default: nhdplus_h
          $ref: '#/components/schemas/nhdplus_version'
        return_code:
          $ref: '#/components/schemas/return_code'
        status_message:
          $ref: '#/components/schemas/status_message'
    ordinate:
