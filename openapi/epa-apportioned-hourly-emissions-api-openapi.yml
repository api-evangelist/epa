openapi: 3.2.0
info:
  title: Epa Apportioned Hourly Emissions API
  contact: {}
  version: '1.0'
  description: 'Operations tagged Apportioned Hourly Emissions across 2 of this provider''s published API definitions: cam-emissions-openapi.json, cam-streaming-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.epa.gov/easey
tags:
- name: Apportioned Hourly Emissions
paths:
  /emissions-mgmt/emissions/apportioned/hourly:
    get:
      operationId: HourlyApportionedEmissionsController_getEmissions
      parameters:
      - name: stateCode
        required: false
        in: query
        description: Two letter abbreviation for the State.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - AL
            - AK
            - AS
            - AZ
            - AR
            - CA
            - CO
            - CT
            - DE
            - DC
            - FM
            - FL
            - GA
            - GU
            - HI
            - ID
            - IL
            - IN
            - IA
            - KS
            - KY
            - LA
            - ME
            - MH
            - MD
            - MA
            - MI
            - MN
            - MS
            - MO
            - MT
            - NE
            - NV
            - NH
            - NJ
            - NM
            - NY
            - NC
            - ND
            - MP
            - OH
            - OK
            - OR
            - PW
            - PA
            - PR
            - RI
            - SC
            - SD
            - TN
            - TX
            - UT
            - VT
            - VI
            - VA
            - WA
            - WV
            - WI
            - WY
        example:
        - AL
      - name: facilityId
        required: false
        in: query
        description: The Facility ID code assigned by the Department of Energy's Energy Information Administration. The Energy Information Administration Plant ID code is also referred to as the "ORIS code", "ORISPL code", "Facility ID", or "Facility code", among other names. If a Plant ID code has not been assigned by the Department of Energy's Energy Information Administration, then plant code means a code beginning with "88" assigned by the EPA's Clean Air Markets Division for electronic reporting.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: number
        example:
        - 0.0
      - name: unitType
        required: false
        in: query
        description: Type of unit or boiler.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Arch-fired boiler
            - Bubbling fluidized bed boiler
            - Cyclone boiler
            - Cell burner boiler
            - Combined cycle
            - Circulating fluidized bed boiler
            - Combustion turbine
            - Dry bottom wall-fired boiler
            - Dry bottom turbo-fired boiler
            - Dry bottom vertically-fired boiler
            - Internal combustion engine
            - Integrated gasification combined cycle
            - Cement Kiln
            - Other boiler
            - Other turbine
            - Pressurized fluidized bed boiler
            - Process Heater
            - Stoker
            - Tangentially-fired
            - Wet bottom wall-fired boiler
            - Wet bottom turbo-fired boiler
            - Wet bottom vertically-fired boiler
        example:
        - Arch-fired boiler
      - name: unitFuelType
        required: false
        in: query
        description: Primary or Secondary fuel types combusted by the unit.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Coal
            - Coal Refuse
            - Diesel Oil
            - Liquified Petroleum Gas
            - Natural Gas
            - Other Gas
            - Other Oil
            - Other Solid Fuel
            - Petroleum Coke
            - Pipeline Natural Gas
            - Process Gas
            - Process Sludge
            - Refuse
            - Residual Oil
            - Tire Derived Fuel
            - Waste Liquid
            - Wood
        example:
        - Coal
      - name: controlTechnologies
        required: false
        in: query
        description: Method or equipment used by the combustion unit to minimize Hg, NOx, PM, or SO2 emissions.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Additives to Enhance PAC and Existing Equipment Performance
            - Ammonia Injection
            - Baghouse
            - Catalyst (gold, palladium, or other) used to oxidize mercury
            - Combustion Modification/Fuel Reburning
            - Cyclone
            - Dry Lime FGD
            - Dry Low NOx Burners
            - Dry Sorbent Injection
            - Dual Alkali
            - Electrostatic Precipitator
            - Fluidized Bed Limestone Injection
            - Halogenated PAC Sorbent Injection
            - Hybrid ESP
            - Low NOx Burner Technology (Dry Bottom only)
            - Low NOx Burner Technology w/ Closed-coupled OFA
            - Low NOx Burner Technology w/ Closed-coupled/Separated OFA
            - Low NOx Burner Technology w/ Overfire Air
            - Low NOx Burner Technology w/ Separated OFA
            - Low NOx Cell Burner
            - Magnesium Oxide
            - Other
            - Other (Non PAC) Sorbent Injection
            - Overfire Air
            - Regenerative Activated Coke Technology
            - Selective Catalytic Reduction
            - Selective Non-catalytic Reduction
            - Sodium Based
            - Steam Injection
            - Untreated PAC Sorbent Injection
            - Water Injection
            - Wet ESP
            - Wet Lime FGD
            - Wet Limestone
            - Wet Scrubber
        example:
        - Additives to Enhance PAC and Existing Equipment Performance
      - name: programCodeInfo
        required: false
        in: query
        description: Statutory or regulatory based options for tracking and reducing air pollution emissions.
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - ARP
            - CAIRNOX
            - CAIROS
            - CAIRSO2
            - CSNOX
            - CSNOXOS
            - CSOSG1
            - CSOSG2
            - CSOSG2E
            - CSOSG3
            - CSSO2G1
            - CSSO2G2
            - NBP
            - NHNOX
            - NSPS4T
            - OTC
            - RGGI
            - SIPNOX
            - TXSO2
        example:
        - ARP
      - name: beginDate
        required: true
        in: query
        description: Begin date for a given period of a unit's emissions.
        schema:
          format: date-time
          type: string
        example: '2024-01-15T12:00:00Z'
      - name: endDate
        required: true
        in: query
        description: End date for a given period of a unit's emissions.
        schema:
          format: date-time
          type: string
        example: '2024-01-15T12:00:00Z'
      - name: operatingHoursOnly
        required: false
        in: query
        description: Indicator of whether or not a request should return only data for hours where a unit operated.
        schema:
          type: boolean
        example: true
      - name: locationName
        required: false
        in: query
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
        example:
        - EPA Facility
      - name: page
        required: true
        in: query
        description: Page number of data being requested.
        schema:
          type: number
        example: 0.0
      - name: perPage
        required: true
        in: query
        description: Number of results per page.
        schema:
          type: number
        example: 0.0
      responses:
        '200':
          description: Retrieves Hourly Apportioned Emissions per filter criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HourUnitDataView'
              examples:
                HourlyApportionedEmissionsController_getEmissions200Example:
                  summary: Default HourlyApportionedEmissionsController_getEmissions 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
            text/csv:
              schema:
                type: string
                example: State,Facility Name,Facility ID,Unit ID,unit_id,Associated Stacks,Date,Hour,Operating Time,Gross Load (MW),Steam Load (1000 lb/hr),SO2 Mass (lbs),SO2 Mass Measure Indicator,SO2 Rate (lbs/mmBtu),SO2 Rate Measure Indicator,CO2 Mass (short tons),CO2 Mass Measure Indicator,CO2 Rate (short tons/mmBtu),CO2 Rate Measure Indicator,NOx Mass (lbs),NOx Mass Measure Indicator,NOx Rate (lbs/mmBtu),NOx Rate Measure Indicator,Heat Input (mmBtu),Heat Input Measure Indicator,Primary Fuel Type,Secondary Fuel Type,Unit Type,SO2 Controls,NOx Controls,PM Controls,Hg Controls,Program Code
              examples:
                HourlyApportionedEmissionsController_getEmissions200Example:
                  summary: Default HourlyApportionedEmissionsController_getEmissions 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '400':
          description: Invalid Request
        '404':
          description: Resource Not Found
      security:
      - APIKey: []
      tags:
      - Apportioned Hourly Emissions
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: https://api.epa.gov/easey
