openapi: 3.2.0
info:
  title: Epa Health API
  contact: {}
  version: '1.0'
  description: 'Operations tagged Health across 8 of this provider''s published API definitions: cam-account-openapi.json, cam-camd-services-openapi.json, cam-emissions-openapi.json, cam-facilities-openapi.json, cam-master-data-openapi.json, cam-monitor-plan-openapi.json, cam-qa-cert-openapi.json, cam-streaming-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.epa.gov/easey
tags:
- name: Health
