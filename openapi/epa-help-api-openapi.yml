openapi: 3.2.0
info:
  title: Epa Help API
  version: '1.0'
  description: 'Operations tagged Help across 2 of this provider''s published API definitions: csb-rebate-openapi.json, elg-search-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://owapps-stage.app.cloud.gov/elg
tags:
- name: Help
paths:
  /api/help/formio/s3/{rebateYear}/{formType}/storage/s3:
    get:
      summary: Download Formio File Attachment from S3 for a Submission.
      parameters:
      - $ref: '#/components/parameters/rebateYear'
      - $ref: '#/components/parameters/formType'
      - $ref: '#/components/parameters/bucket'
      - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Help
  /api/help/formio/submission/{rebateYear}/{formType}/{id}:
    get:
      summary: Get an Existing Form's Submission Data from Formio.
      parameters:
      - $ref: '#/components/parameters/rebateYear'
      - $ref: '#/components/parameters/formType'
      - in: path
        name: id
        description: The CSB Rebate ID or Formio MongoDB ObjectId.
        required: true
        example: '000000'
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rebateId:
                    type:
                    - string
                    - 'null'
                    example: '000000'
                  schema:
                    type:
                    - object
                    - 'null'
                  formio:
                    type:
                    - object
                    - 'null'
                  bap:
                    type:
                    - object
                    - 'null'
                    properties:
                      modified:
                        type: string
                        example: '2024-01-01T12:00:00.000Z'
                      comboKey:
                        type: string
                        example: '0000000000000000'
                      mongoId:
                        type: string
                        example: '000000000000000000000000'
                      rebateId:
                        type: string
                        example: '000000'
                      reviewItemId:
                        type: string
                        example: 000000A01
                      status:
                        type: string
                        example: Accepted
                      reimbursementNeeded:
                        type: boolean
                        example: false
              examples:
                get_api_help_formio_submission_{rebateYear}_{formType}_{id}200Example:
                  summary: Default get_api_help_formio_submission_{rebateYear}_{formType}_{id} 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Help
    post:
      summary: Post an Update to an Existing Form Submission to Formio (change Submission to 'draft').
      parameters:
      - $ref: '#/components/parameters/rebateYear'
      - $ref: '#/components/parameters/formType'
      - in: path
        name: id
        description: The CSB Rebate ID or Formio MongoDB ObjectId.
        required: true
        example: '000000000000000000000000'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: The updated form submission.
          content:
            application/json:
              schema:
                type: object
              examples:
                post_api_help_formio_submission_{rebateYear}_{formType}_{id}200Example:
                  summary: Default post_api_help_formio_submission_{rebateYear}_{formType}_{id} 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Help
  /api/help/formio/actions/{formId}/{mongoId}:
    get:
      summary: Get All Actions Associated with a Form's Submission from Formio.
      parameters:
      - $ref: '#/components/parameters/formId'
      - $ref: '#/components/parameters/mongoId'
      responses:
        '200':
          description: An array of actions associated with the form's submission.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                get_api_help_formio_actions_{formId}_{mongoId}200Example:
                  summary: Default get_api_help_formio_actions_{formId}_{mongoId} 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Help
  /api/help/formio/pdf/{formId}/{mongoId}:
    get:
      summary: Get a PDF of an Existing Form's Submission from Formio.
      parameters:
      - $ref: '#/components/parameters/formId'
      - $ref: '#/components/parameters/mongoId'
      responses:
        '200':
          description: A PDF of the form's submission.
          content:
            '*/*':
              schema:
                type: string
                format: byte
              examples:
                get_api_help_formio_pdf_{formId}_{mongoId}200Example:
                  summary: Default get_api_help_formio_pdf_{formId}_{mongoId} 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Help
  /api/help:
    get:
      summary: Help
      description: Placeholder
      tags:
      - Help
      responses:
        '200':
          description: Placeholder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/glossary.help'
              examples:
                get_api_help200Example:
                  summary: Default get_api_help 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
    servers:
    - url: https://owapps-stage.app.cloud.gov/elg
components:
  parameters:
    formType:
      in: path
      name: formType
      description: The Formio form type (frf, prf, crf).
      required: true
      example: frf
      schema:
        type: string
    rebateYear:
      in: path
      name: rebateYear
      description: The Clean School Bus Rebate year (2022, 2023, 2024).
      required: true
      example: '2022'
      schema:
        type: string
    bucket:
      in: query
      name: bucket
      description: The S3 bucket name where the file is stored.
      required: true
      example: cleanschoolbus
      schema:
        type: string
    mongoId:
      in: path
      name: mongoId
      description: The Formio submission's MongoDB ObjectId.
      required: true
      example: '000000000000000000000000'
      schema:
        type: string
    formId:
      in: path
      name: formId
      description: The Formio form's MongoDB ObjectId.
      required: true
      example: '000000000000000000000000'
      schema:
        type: string
    key:
      in: query
      name: key
      description: The S3 object key for the file.
      required: true
      example: placeholder-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.png
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
  schemas:
    glossary.help:
      type: object
      description: Placeholder
      properties:
        Dummy:
          type: string
          title: Dummy
          example: Dummy
          description: Dummy
      required:
      - Dummy
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- csb-rebate-openapi.json
- elg-search-openapi.json
