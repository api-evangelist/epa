              examples:
                AllowanceComplianceController_getAllOwnerOperators200Example:
                  summary: Default AllowanceComplianceController_getAllOwnerOperators 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
        '400':
