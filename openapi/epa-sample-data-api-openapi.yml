      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Param'
      - $ref: '#/components/parameters/Bdate'
      - $ref: '#/components/parameters/Edate'
      - $ref: '#/components/parameters/State'
      - $ref: '#/components/parameters/County'
      - $ref: '#/components/parameters/Duration'
      - $ref: '#/components/parameters/Cbdate'
      - $ref: '#/components/parameters/Cedate'
      responses:
        '200':
          description: Samples in county
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                sampleDataByCounty200Example:
                  summary: Default sampleDataByCounty 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /sampleData/byState:
    get:
      tags:
      - Sample Data
      summary: Get Sample Data by State
      operationId: sampleDataByState
      parameters:
      - $ref: '#/components/parameters/Email'
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Param'
      - $ref: '#/components/parameters/Bdate'
      - $ref: '#/components/parameters/Edate'
      - $ref: '#/components/parameters/State'
      - $ref: '#/components/parameters/Duration'
      - $ref: '#/components/parameters/Cbdate'
      - $ref: '#/components/parameters/Cedate'
      responses:
        '200':
          description: Samples in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                sampleDataByState200Example:
                  summary: Default sampleDataByState 200 response
                  x-microcks-default: true
                  value:
                    status: ok
                    message: Example response
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /sampleData/byBox:
