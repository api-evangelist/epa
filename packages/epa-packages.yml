method: searched
source: >-
  PyPI (pypi.org/pypi/<pkg>/json), CRAN (crandb.r-pkg.org), the npm registry search API, and the
  USEPA + US-EPA-CAMD GitHub organizations, probed 2026-09-06.
note: >-
  EPA ships first-party client libraries only for the Air Quality System (AQS) Data Mart API, and
  ships them as a matched pair — RAQSAPI for R and pyaqsapi for Python — both maintained in the
  USEPA GitHub organization by EPA Region 3 staff. No first-party client library was found for
  Envirofacts, ECHO, the UV Index service, or the Clean Air Markets (EASEY) APIs; for EASEY, EPA
  publishes worked request examples (USEPA/cam-api-examples) rather than a packaged SDK.
  @us-epa-camd/easey-design-system exists on npm but is NOT first-party — it was published in 2023
  by an unrelated individual at v0.0.1-beta and is recorded here only so it is not mistaken for one.
