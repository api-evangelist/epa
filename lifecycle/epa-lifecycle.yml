status_page: null
status_page_note: >-
  No status page exists. status.epa.gov does not resolve (DNS failure, 2026-09-06);
  www.epa.gov/system-status and echo.epa.gov/resources/general-info/echo-status both return 404.
  EPA publishes no availability signal an integrator can watch, which for a surface with a 15-minute
  request timeout and no rate-limit headers means outages are indistinguishable from throttling.
  No StatusPage pointer is wired into apis.yml, because there is nothing to point at.
