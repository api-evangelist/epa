deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  policy_published: false
  note: >-
    EPA publishes no deprecation policy, no sunset schedule and no notice period for any API in this
    record, and none of the harvested contracts marks an operation deprecated. Retirement happens and
    is not announced through the API. Two observed instances are recorded below.
  observed_retirements:
    - what: CompTox Chemicals Dashboard API host api-ccte.epa.gov
      evidence: >-
        DNS resolution failed for api-ccte.epa.gov on 2026-09-06 ("Could not resolve host"). The
        successor surface is https://comptox.epa.gov/ctx-api/ — a different host, a different path
        prefix, and a hard API-key requirement (HTTP 401 "API Header Not Found" on
        /ctx-api/chemical/v3/api-docs). No redirect, no Sunset header, no deprecation notice: the
        old hostname simply stopped existing.
      probed: '2026-09-06'
    - what: USEEIO_API
      evidence: >-
        github.com/USEPA/USEEIO_API is marked "DEPRECATED - This repository is no longer being
        maintained". The deprecation is announced on GitHub only, not on any EPA API surface.
      probed: '2026-09-06'
