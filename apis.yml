aid: epa
name: EPA — U.S. Environmental Protection Agency
description: >-
  Web services, data products, and open data spanning the U.S. Environmental Protection Agency. Programmatic access to
  air quality, water quality, hazardous waste, toxic releases, facility compliance, power-sector emissions,
  computational toxicology, and watershed assessments through dozens of public APIs.
image: https://www.epa.gov/themes/epa_theme/images/epa-logo.png
url: https://www.epa.gov/developers/data-data-products
specificationVersion: '0.20'
created: '2026-05-28'
modified: '2026-05-29'
x-source: public-apis/public-apis
x-category: Government
x-tier: 1
x-tier-reason: enriched-with-full-pipeline
x-type: government
tags:
- Government
- Environmental
- OpenData
- AirQuality
- WaterQuality
- HazardousWaste
- Compliance
- Emissions
