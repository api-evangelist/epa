    Programmatic access to ambient air pollution monitoring data — sites, monitors, sample/daily/quarterly/annual
    aggregates, and quality assurance results for criteria and hazardous air pollutants.
  humanURL: https://aqs.epa.gov/aqsweb/documents/data_api.html
  baseURL: https://aqs.epa.gov/data/api
  tags:
  - Government
  - Environmental
  - AirQuality
  - Monitoring
  properties:
  - type: Documentation
    url: https://aqs.epa.gov/aqsweb/documents/data_api.html
